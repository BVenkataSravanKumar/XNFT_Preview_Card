<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="./assets/logo.jpeg"/>
    <title>NFT preview card component</title>
    <link rel="stylesheet" href="./css/styles.css"/>
</head>
<body>
    <main class="card">
            <div class="card__images">
                <img src="./assets/image-equilibrium.jpg" alt="nft" class="main-image" />
                <div class="card__images-layer"></div>
                <img src="./assets/icon-view.svg" alt="icon view" class="view"/>
            </div>
            <div class="text-container">
                <h1 class="card__title">Equilibrium #3429</h1>
                <p class="description">Our Equilibrium collection promotes balance and calm.</p>
            </div>
            <div class="card__time">
                <div class="card__time-left"><img src="./assets/icon-ethereum.svg" alt="ethereum icon"/><span> 0.041 ETH</span></div>
                <div class="card__time-right"><img src="./assets/icon-clock.svg" alt="time icon"/><span> 3 days left</span></div>
            </div>
            <div class="card__creator">
                <img src="./assets/avatar.jpg" alt="Creator avatar" />
                <span>Creation of B Venkata Sravan Kumar</span>
            </div>
    </main>
    <footer class="attribution">
        Challenge by <a href="https://www.crio.do" target="_blank">Crio.Do</a>. Coded by <a href="https://github.com/BVenkataSravanKumar/XNFT_Preview_Card" target="_blank">B Venkata Sravan Kumar</a>.
    </footer>
</body>
</html>
